<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PolyAPI</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" />
    <script>
      (function () {
        var nativeFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
          if (url.indexOf("/auth/session") !== -1) {
            var headers = new Headers(
              (init && init.headers) ||
                (typeof input !== "string" && !(input instanceof URL) ? input.headers : undefined)
            );
            if (!headers.has("x-poly-session")) headers.set("x-poly-session", "1");
            init = Object.assign({}, init, {
              headers: headers,
              credentials: (init && init.credentials) || "include",
            });
          }
          return nativeFetch(input, init);
        };

        var hostname = location.hostname;
        var labels = hostname.split(".").filter(Boolean);
        var app = new URLSearchParams(location.search).get("app") || labels[0] || "";
        var ipHost = /^\d{1,3}(?:\.\d{1,3}){3}$/.test(hostname) || hostname.indexOf(":") !== -1;
        var rootDomain = !ipHost && labels.length > 1 ? labels.slice(1).join(".") : "";
        var apiOrigin = rootDomain ? location.protocol + "//" + rootDomain : location.origin;
        var sessionUrl = apiOrigin + "/api/auth/session";
        var specUrl = apiOrigin + "/applications/" + encodeURIComponent(app) + "/spec";

        window.__polyApp = {
          hostname: hostname,
          app: app,
          apiOrigin: apiOrigin,
          sessionUrl: sessionUrl,
          specUrl: specUrl,
          urls: {},
          files: {},
          sessionResponse: fetch(sessionUrl, {
            method: "GET",
            credentials: "include",
            headers: { "x-poly-session": "1" },
          }),
          specResponse: fetch(specUrl, { method: "GET" }),
        };
      })();
    </script>
    <style>
      :root {
        --poly-logo-body: #e63f36;
        --poly-logo-beak: #f9b727;
        --poly-logo-front-wing: #3e76ef;
        --poly-logo-back-wing: #2f9e4d;
        --poly-logo-eyes: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Roboto", sans-serif;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #262626;
        color: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 48px;
        font-weight: 400;
        text-align: center;
        margin: 8px 0 0;
      }

      #root {
        width: 100%;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      (function () {
        var app = window.__polyApp;
        var rootEl = document.getElementById("root");

        function specifierOrder(urls) {
          return Object.keys(urls).sort(function (a, b) {
            if (a === "poly:vendor") return -1;
            if (b === "poly:vendor") return 1;
            return a < b ? -1 : a > b ? 1 : 0;
          });
        }

        function moduleReport() {
          return specifierOrder(app.urls).map(function (specifier) {
            var file = app.files[specifier];
            var url = app.urls[specifier];
            if (!file) return { specifier: specifier, url: url, status: "queued" };
            if (file.ok) return { specifier: specifier, url: url, status: "downloaded", bytes: file.body.length };
            return { specifier: specifier, url: url, status: "stored for retry", error: file.error };
          });
        }

        async function download(specifier, credentials) {
          var url = app.urls[specifier];
          if (!url) return;
          try {
            var headers = credentials === "include" ? { "x-poly-session": "1" } : undefined;
            var res = await fetch(url, { method: "GET", credentials: credentials, headers: headers });
            if (!res.ok) throw new Error("HTTP " + res.status);
            var body = await res.text();
            var type = res.headers.get("content-type") || "";
            if (type.indexOf("text/html") !== -1 || body.trim().charAt(0) === "<") {
              throw new Error("URL returned HTML instead of JavaScript");
            }
            app.files[specifier] = { url: url, ok: true, body: body };
          } catch (err) {
            app.files[specifier] = {
              url: url,
              ok: false,
              error: err && err.message ? err.message : String(err),
            };
          }
        }

        app.refetch = async function (specifier) {
          await download(specifier, "include");
          console.log("Spec modules", moduleReport());
          return app.files[specifier];
        };

        async function downloadAll(credentials) {
          var order = specifierOrder(app.urls);
          if (order.indexOf("poly:vendor") !== -1) {
            await download("poly:vendor", credentials);
          }
          await Promise.all(
            order
              .filter(function (specifier) {
                return specifier !== "poly:vendor";
              })
              .map(function (specifier) {
                return download(specifier, credentials);
              })
          );
          console.log("Spec modules", moduleReport());
        }

        function rootSpecifier(spec, authenticated) {
          var name = authenticated && spec.authenticatedRoot ? spec.authenticatedRoot : spec.unauthenticatedRoot;
          return name ? "poly:" + name : "";
        }

        function componentCodeUrl(path) {
          return app.apiOrigin + "/functions/component/" + encodeURIComponent(path) + "/code.js?usePathId=true";
        }

        function ensureSpecifierUrl(specifier) {
          if (!specifier || app.urls[specifier]) return;
          if (specifier.indexOf("poly:") !== 0) return;
          app.urls[specifier] = componentCodeUrl(specifier.slice(5));
        }

        function missingImports(specifier) {
          var file = app.files[specifier];
          if (!file || !file.ok) return [];
          var found = file.body.match(/["']poly:[^"']+["']/g) || [];
          var pending = [];
          found.forEach(function (token) {
            var name = token.slice(1, -1);
            if (name === specifier || app.files[name]) return;
            ensureSpecifierUrl(name);
            if (app.urls[name]) pending.push(name);
          });
          return pending;
        }

        function mountRoot(specifier) {
          var current = document.getElementById("root");
          var next = document.createElement("div");
          next.id = "root";
          current.replaceWith(next);
          rootEl = next;
          var imports = {};
          specifierOrder(app.urls).forEach(function (name) {
            var file = app.files[name];
            if (!file || !file.ok) return;
            imports[name] = URL.createObjectURL(new Blob([file.body], { type: "text/javascript" }));
          });
          var map = document.createElement("script");
          map.type = "importmap";
          map.textContent = JSON.stringify({ imports: imports });
          document.head.appendChild(map);

          var mount = document.createElement("script");
          mount.type = "module";
          mount.textContent = [
            "const rootEl = document.getElementById('root');",
            "const specifier = " + JSON.stringify(specifier) + ";",
            "try {",
            "  const mod = await import(specifier);",
            "  const Component = mod.default || mod[Object.keys(mod).find((key) => typeof mod[key] === 'function')];",
            "  if (!Component) throw new Error('Root module did not export a component');",
            "  const vendor = await import('poly:vendor');",
            "  const react = vendor.react || vendor.default;",
            "  const reactDom = vendor['react-dom'] || vendor.reactDom;",
            "  const createRoot = (reactDom && reactDom.createRoot) || (vendor.reactDomClient && vendor.reactDomClient.createRoot);",
            "  if (!createRoot) throw new Error('poly:vendor has no createRoot');",
            "  createRoot(rootEl).render(react.createElement(Component));",
            "} catch (error) {",
            "  console.error(error);",
            "  rootEl.textContent = String(error);",
            "}",
          ].join("\n");
          document.body.appendChild(mount);
        }

        async function boot() {
          console.log("Current domain", app.hostname || location.hostname);
          var sessionOk = false;
          try {
            var sessionRes = await app.sessionResponse;
            if (!sessionRes.ok) throw new Error("HTTP " + sessionRes.status);
            var sessionBody = await sessionRes.json();
            if (!sessionBody || !sessionBody.id) throw new Error("session response was not a session");
            sessionOk = true;
            console.log("Session", "cookie present");
          } catch (err) {
            console.log(
              "Session",
              "No session cookie (" + (err && err.message ? err.message : String(err)) + "). Rendering unauthenticated root."
            );
          }

          var spec;
          try {
            var specRes = await app.specResponse;
            if (!specRes.ok) throw new Error("HTTP " + specRes.status);
            spec = await specRes.json();
          } catch (err) {
            var message = err && err.message ? err.message : String(err);
            console.error("Spec", message);
            rootEl.textContent = message;
            return;
          }

          app.spec = spec;
          app.urls = spec.imports && typeof spec.imports === "object" ? spec.imports : {};
          await showRoot(sessionOk);
        }

        async function loadSpecifier(specifier, credentials, seen) {
          if (!specifier || seen[specifier]) return;
          seen[specifier] = true;
          ensureSpecifierUrl(specifier);
          if (!app.files[specifier] || !app.files[specifier].ok) await download(specifier, credentials);
          var pending = missingImports(specifier);
          for (var i = 0; i < pending.length; i++) {
            await loadSpecifier(pending[i], credentials, seen);
          }
        }

        async function showRoot(authenticated) {
          if (authenticated && !app.spec.authenticatedRoot) {
            console.log("Authenticated code", "(none) The spec has no authenticatedRoot.");
            return;
          }
          var specifier = rootSpecifier(app.spec, authenticated);
          if (authenticated) ensureSpecifierUrl(specifier);
          app.activeRoot = specifier;
          var credentials = authenticated ? "include" : "omit";
          console.log(authenticated ? "Authenticated code" : "Unauthenticated code", specifier || "(none)");
          await downloadAll(credentials);
          if (specifier) await loadSpecifier(specifier, credentials, {});
          var file = specifier && app.files[specifier];
          if (file && file.ok) {
            console.log(authenticated ? "Authenticated code" : "Unauthenticated code", file.body);
            mountRoot(specifier);
            return;
          }
          var reason = !specifier
            ? "The spec did not name a root component."
            : file && file.error
              ? file.error
              : "Root module was not downloaded.";
          console.error(specifier || "root", reason);
          rootEl.textContent = reason;
        }

        window.addEventListener("poly-session", function () {
          showRoot(true);
        });

        boot();
      })();
    </script>
  </body>
</html>
