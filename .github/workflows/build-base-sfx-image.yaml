name: Build Base SFX Image

on:
  workflow_dispatch:
    inputs:
      polyapi_version:
        description: polyapi package version
        required: true
  workflow_run:
    workflows:
      - Docker Image & NPM publish CI/CD
    types:
      - completed
    branches:
      - develop

jobs:
  build-and-push:
    name: Build and push polyapi ${{ matrix.flavor }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, perch]
    concurrency:
      group: build-${{ matrix.flavor }}-sfx-${{ github.event.inputs.polyapi_version || github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
    env:
      FLAVOR: ${{ matrix.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve polyapi version
        id: resolve-version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.polyapi_version }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not resolve polyapi version" >&2
            exit 1
          fi

          echo "polyapi_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using polyapi version: $VERSION"

      - name: Wait for polyapi release on npm
        if: matrix.flavor == 'base'
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-version.outputs.polyapi_version }}"
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=20

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if curl --silent --fail --head "https://registry.npmjs.org/polyapi/${VERSION}" >/dev/null; then
              echo "polyapi@$VERSION is available on npm"
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Timed out waiting for polyapi@$VERSION to appear on npm" >&2
              exit 1
            fi

            echo "Attempt $attempt/$MAX_ATTEMPTS: polyapi@$VERSION not visible yet, retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check if image already exists
        id: check-image
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-version.outputs.polyapi_version }}"
          IMAGE="ghcr.io/polyapi/polyapi-ts-${VERSION}-${FLAVOR}:latest"

          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$FLAVOR image already exists, skipping"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$FLAVOR image does not exist, continuing build"
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kn func CLI
        if: steps.check-image.outputs.image_exists != 'true'
        run: |
          curl -fsSL -o /tmp/func \
            https://github.com/knative/func/releases/download/knative-v1.23.0/func_linux_amd64
          chmod +x /tmp/func
          sudo mv /tmp/func /usr/local/bin/func
          func version

      - name: Create Node function scaffold
        if: steps.check-image.outputs.image_exists != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-version.outputs.polyapi_version }}"
          VERSION_SAFE="$(printf '%s' "$VERSION" | tr '.' '-')"
          FUNC_DIR="${RUNNER_TEMP}/polyapi-ts-${VERSION_SAFE}-${FLAVOR}"
          rm -rf "$FUNC_DIR"
          mkdir -p "$FUNC_DIR"
          (
            cd "$FUNC_DIR"
            func create -l node
          )
          echo "FUNC_DIR=$FUNC_DIR" >> "$GITHUB_ENV"

      - name: Install runtime dependency
        if: steps.check-image.outputs.image_exists != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-version.outputs.polyapi_version }}"
          if [ "$FLAVOR" = "perch" ]; then
            DEPENDENCY="polyapi@npm:perch-ts@latest"
          else
            DEPENDENCY="polyapi@${VERSION}"
          fi

          MAX_ATTEMPTS=10
          SLEEP_SECONDS=15
          cd "$FUNC_DIR"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if npm install --prefer-online "$DEPENDENCY"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Failed to install $DEPENDENCY after $MAX_ATTEMPTS attempts" >&2
              exit 1
            fi
            echo "Attempt $attempt/$MAX_ATTEMPTS: install failed, retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done
          cd - >/dev/null
          echo "Final package.json:"
          cat "${FUNC_DIR}/package.json"

      - name: Normalize func.yaml build settings
        if: steps.check-image.outputs.image_exists != 'true'
        run: |
          set -euo pipefail
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="${{ steps.resolve-version.outputs.polyapi_version }}"
          cat > "${FUNC_DIR}/func.yaml" <<EOF
          specVersion: 0.36.0
          name: polyapi-ts-${VERSION}-${FLAVOR}
          runtime: node
          created: ${CREATED}
          build:
            builderImages:
              pack: ghcr.io/knative/builder-jammy-base:latest
            builder: pack
            buildEnvs:
              - name: BP_NODE_VERSION
                value: "20.*"
          EOF
          echo "Final func.yaml:"
          cat "${FUNC_DIR}/func.yaml"

      - name: Build and push image with kn func
        if: steps.check-image.outputs.image_exists != 'true'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/polyapi/polyapi-ts-${{ steps.resolve-version.outputs.polyapi_version }}-${FLAVOR}:latest"
          func build --image "$IMAGE" --push=false -p "$FUNC_DIR" --verbose

      - name: Fix node_modules ownership and push image
        if: steps.check-image.outputs.image_exists != 'true'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/polyapi/polyapi-ts-${{ steps.resolve-version.outputs.polyapi_version }}-${FLAVOR}:latest"
          docker build -t "$IMAGE" - <<EOF
          FROM ${IMAGE}
          USER root
          RUN if [ -d /layers/paketo-buildpacks_npm-install/launch-modules/node_modules ]; then chown -R 1001:1001 /layers/paketo-buildpacks_npm-install/launch-modules/node_modules; fi
          USER 1001
          EOF
          docker push "$IMAGE"

      - name: Verify pushed image
        if: steps.check-image.outputs.image_exists != 'true'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/polyapi/polyapi-ts-${{ steps.resolve-version.outputs.polyapi_version }}-${FLAVOR}:latest"
          docker pull "$IMAGE"
          echo "Published image: $IMAGE"